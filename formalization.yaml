# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/v0.4.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
version: "v0.4"

project:
  name: "Hilbert14Kuroda"
  description: >-
    This project formalizes Kuroda's explicit three-variable counterexample to
    Hilbert's fourteenth problem in Lean 4. It proves that the intersection of
    the specified subfield with the polynomial ring is not finitely generated.
  authors:
    - "Evgeny Obukhov (guidance)"
    - "Codex (Lean formalization)"
  license: "Apache-2.0"
sources:
  - title: "Hilbert's fourteenth problem and field modifications"
    id: "https://arxiv.org/abs/1803.08002v1"
    authors:
      - "Shigeru Kuroda"
    type: "article"
    location: "Section 4.1, parameter t₂=5; Theorem 1.4 and Lemma 2.2"
    relationship: "formalizes"

classification:
  arxiv:
    - "math.AC"
    - "math.AG"
status:
  scope: "Full formalization of the explicit counterexample over every characteristic-zero field."
  sorry_count: 0 # Excludes the deliberate placeholder in the separate Comparator reference.
  sorry_in_definitions: 0
  main_results:
    - description: >-
        The subfield generated by x^5*y+x^(-2), x^4*y-x^(-2)+x^(-3),
        and z+x^(-1) in C(x,y,z) has an intersection with C[x,y,z]
        that is not finitely generated as a C-algebra.
      declaration: "Hilbert14.Paper.counterexample"
      file: "Hilbert14/ComparatorSolution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "ComparatorChallenges/Hilbert14.json"
automation:
  methods:
    - method: "agent"
      framework: "Codex"

review:
  status: "self-assessed"
alignment:
  namespaces:
    - "Hilbert14.Paper"
  statements:
    - source: "Section 4.1, parameter t₂=5"
      lean: "Hilbert14.Paper.counterexample"
      module: "Hilbert14.ComparatorSolution"
      status: "proved"
acknowledgements: >-
  We thank the authors and contributors of Lean 4, Mathlib, Lake, Comparator,
  lean4export and Nanoda.
